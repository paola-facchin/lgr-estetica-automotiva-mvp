{% extends 'core/base.html' %}{% block title %}Entrar · LGR{% endblock %}{% block content %}<section class="card login"><h1>Acessar sistema</h1><p>Entre com seu usuário autorizado.</p><form method="post">{% csrf_token %}{% if form.errors %}<p class="aviso erro" role="alert">Usuário ou senha inválidos.</p>{% endif %}<div class="formgrupo"><label for="id_username">Usuário</label><input class="campo" name="username" id="id_username" autocomplete="username" required autofocus></div><div class="formgrupo"><label for="id_password">Senha</label><input class="campo" name="password" id="id_password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar</button></form></section>{% endblock %}
