name: Evidencias - Telas reais do Django

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "segredo-efemero-apenas-para-capturas-de-teste"

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Django e navegador de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Criar banco de dados de teste
        run: python manage.py migrate --noinput

      - name: Capturar as tres telas REAIS
        run: python scripts/capturar_evidencias.py

      - name: Disponibilizar capturas para DreamShaper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-telas-lgr
          path: docs/evidencias/*.png
          if-no-files-found: error
