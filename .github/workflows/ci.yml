name: CI - Testes Django

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "chave-ficticia-exclusiva-para-testes-ci"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias e coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7,<8"

      - name: Verificar configuracao Django
        run: python manage.py check

      - name: Executar testes automatizados com cobertura
        run: |
          coverage run --source=core --omit="*/migrations/*,*/tests.py" manage.py test -v 2
          coverage report --show-missing
          coverage xml -o coverage.xml

      - name: Salvar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-testes
          path: coverage.xml
          if-no-files-found: ignore
